<style>
#ha-unified59-devices{--dc-bg:light-dark(#f5f6f7,#101519);--dc-card:light-dark(#fff,#20262c);--dc-track:light-dark(#e9edf2,#303640);--dc-text:light-dark(#23292c,#f1f3f5);--dc-muted:light-dark(#64747e,#a6b0b7);--dc-line:light-dark(#e8ecef,#343b42);--dc-blue:light-dark(#167be1,#329aff);--dc-selected:light-dark(#e6f2ff,#21394f);font:16px/1.4 "Microsoft YaHei",system-ui,sans-serif;color:var(--dc-text)}
#ha-unified59-devices *{box-sizing:border-box}
#ha-unified59-devices [hidden]{display:none!important}
#ha-unified59-devices .dc-app{background:var(--dc-bg);border-radius:22px;overflow:hidden;min-height:600px}
#ha-unified59-devices button,#ha-unified59-devices input,#ha-unified59-devices select{font:inherit;color:inherit}
#ha-unified59-devices button{border:0}
#ha-unified59-devices .dc-bar{height:64px;background:light-dark(#f1f1fc,#202642);display:flex;align-items:center;gap:16px;padding:0 16px;font-size:25px}
#ha-unified59-devices .dc-bar small{margin-left:auto;font-size:12px;color:var(--dc-muted);padding-right:86px}
#ha-unified59-devices .dc-icon{width:44px;height:44px;border-radius:12px;background:var(--dc-track);display:grid;place-items:center;flex-shrink:0}
#ha-unified59-devices .dc-bar .dc-icon{background:light-dark(#e6e7fb,#343b54)}
#ha-unified59-devices .dc-frame{display:grid;grid-template-columns:164px minmax(0,1fr);min-height:536px}
#ha-unified59-devices .dc-nav{background:var(--dc-card);display:flex;flex-direction:column;gap:8px;padding:20px 10px}
#ha-unified59-devices .dc-nav strong{font-size:19px;font-weight:500;padding:0 10px 16px}
#ha-unified59-devices .dc-nav button,#ha-unified59-devices .dc-nav>span{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:9px;background:transparent}
#ha-unified59-devices .dc-nav [aria-pressed=true]{background:var(--dc-selected);color:var(--dc-blue)}
#ha-unified59-devices .dc-nav svg{width:20px;height:20px;flex-shrink:0}
#ha-unified59-devices .dc-nav small{margin-top:auto;color:var(--dc-muted);font-size:12px;padding:18px 7px 0}
#ha-unified59-devices .dc-main{padding:16px 18px;min-width:0}
#ha-unified59-devices .dc-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;margin-bottom:16px}
#ha-unified59-devices .dc-page-title{font-size:20px;margin-right:auto}

 picker.onchange=()=>{state.device=picker.value;state.page=Math.floor(ids.indexOf(state.device)/6);state.view='overview';render();persist();};root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav==='detail'?'overview':b.dataset.nav;render();persist();});root.querySelector('[data-home]').onclick=()=>{state.view='overview';render();persist();};
 window.addEventListener('openai:set_globals',e=>{
  const next=e.detail?.globals?.widgetState?.privateContent;if(!next||!devices[next.device]||!['overview','detail','scenes','logs'].includes(next.view))return;
  const incoming={};
  Object.entries(next.values||{}).forEach(([device,values])=>{if(!devices[device]||!values||typeof values!=='object')return;incoming[device]=Object.fromEntries(Object.entries(values).filter(([id,value])=>(fieldsByDevice.get(device).has(id)||id==='power'||id==='rgb')&&(['string','boolean'].includes(typeof value)||(typeof value==='number'&&Number.isFinite(value)))));});
  let changed=false;
  new Set([...Object.keys(state.values),...Object.keys(incoming)]).forEach(device=>{
   if(!devices[device])return;const before=state.values[device]||{},after=incoming[device]||{};
   new Set([...Object.keys(before),...Object.keys(after)]).forEach(id=>{
    const fallback=id==='power'?true:id==='rgb'?'#ffa64e':fieldsByDevice.get(device).get(id)?.value;
    if(!Object.is(before[id]??fallback,after[id]??fallback)){markChanged(device,id);changed=true;}
   });
  });
  const page=Math.max(0,Math.min(pageCount-1,Math.trunc(Number(next.page))||0));
  const navigationChanged=state.device!==next.device||state.view!==next.view||state.page!==page;
  if(!changed&&!navigationChanged)return;
  flushPaint();if(saveTimer)clearTimeout(saveTimer);saveTimer=0;savePending=false;
  state={device:next.device,view:next.view,page,values:incoming};lastSavedSignature=signature();render();
 });
